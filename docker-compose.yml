version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: cldb_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cldb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./db/seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: cldb_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: cldb_mlflow
    ports:
      - "5001:5000"
    volumes:
      - mlflow_data:/mlflow/artifacts
    environment:
      MLFLOW_TRACKING_URI: sqlite:///mlflow/mlflow.db
      MLFLOW_ARTIFACTS_ROOT: /mlflow/artifacts
    command: mlflow server --host 0.0.0.0 --port 5000

  prometheus:
    image: prom/prometheus:latest
    container_name: cldb_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  app:
    build: .
    container_name: cldb_app
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-cldb}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - CLDB_ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - METRICS_ENABLED=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./models:/app/models
      - ./experiments:/app/experiments
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'

  dashboard:
    build: .
    container_name: cldb_dashboard
    depends_on:
      - app
      - postgres
      - qdrant
    ports:
      - "8501:8501"
    environment:
      - POSTGRES_HOST=postgres
      - QDRANT_HOST=qdrant
      - CLDB_ENVIRONMENT=production
    volumes:
      - ./dashboard:/app/dashboard

volumes:
  postgres_data:
  qdrant_data:
  mlflow_data:
  prometheus_data: